name: Ubuntu Build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: apt install
      run: sudo apt install -y build-essential cmake libgl1-mesa-dev qt6-tools-dev qt6-base-dev qt6-base-dev-tools qt6-tools-dev-tools qt6-declarative-dev libqt6widgets6 libqt6quickwidgets6 libqt6gui6 qt6-l10n-tools gcovr
    - name: cmake 
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
    - name: make
      run: make -C build -j8 all
    - name: test
      run: ctest --test-dir build --output-on-failure
    - name: coverage
      run: |
        mkdir -p build/coverage
        gcovr --root . --filter src/ --txt build/coverage/coverage.txt --html-details build/coverage/index.html
        cat build/coverage/coverage.txt
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat build/coverage/coverage.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: build/coverage
